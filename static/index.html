<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoE City Redesigner</title>
    <link rel="stylesheet" href="static/style.css?v=1.0.5">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="header">
                <h1>City Redesigner</h1>
                <p>Forge of Empires Layout Optimizer</p>
            </div>
            
            <div class="panel map-controls">
                <h2>Map Controls</h2>
                <div class="control-group">
                    <label>Grid Size</label>
                    <div class="inputs">
                        <input type="number" id="grid-width" value="20" min="5" max="100">
                        <span>×</span>
                        <input type="number" id="grid-height" value="20" min="5" max="100">
                    </div>
                    <button id="btn-resize" class="btn secondary">Apply Size</button>
                </div>
                <div class="mode-toggle">
                    <button id="btn-mode-paint" class="btn active">Paint Map</button>
                    <button id="btn-mode-erase" class="btn">Erase Map</button>
                </div>
                <div id="paint-road-type-container" style="display: none; flex-direction: column; gap: 4px; margin-top: 8px; width: 100%;">
                    <label for="paint-road-type" style="font-size: 0.8rem; color: var(--text-muted);">Paint Road Type</label>
                    <select id="paint-road-type" style="width: 100%;">
                        <option value="1">1-Lane (1×1)</option>
                        <option value="2">2-Lane (2×2)</option>
                    </select>
                </div>
            </div>

            <div class="panel solver-controls">
                <h2>Solver Options</h2>
                
                <div class="inputs" style="flex-direction: column; align-items: flex-start; gap: 4px;">
                    <label for="solver-select" style="font-size: 0.8rem; color: var(--text-muted);">Solver Algorithm</label>
                    <select id="solver-select" style="width: 100%;">
                        <option value="random_greedy">Random-Restart Greedy (Fast)</option>
                        <option value="simulated_annealing">Simulated Annealing (Incremental)</option>
                        <option value="evolutionary">Evolutionary Algorithm (Genetic)</option>
                        <option value="neural_network">Neuro-Evolutionary Policy Network (AI)</option>
                        <option value="user_heuristic">Heuristic-Guided Packing (User Style)</option>
                        <option value="backbone">Structured Road Backbone</option>
                        <option value="constraint_programming">CP-SAT Math Solver (OR-Tools)</option>
                    </select>
                </div>

                <!-- Backbone Parameters -->
                <div id="backbone-params" style="display: none; flex-direction: column; gap: 4px; width: 100%;">
                    <label for="backbone-select" style="font-size: 0.8rem; color: var(--text-muted);">Road Backbone Style</label>
                    <select id="backbone-select" style="width: 100%;">
                        <option value="none">None (Freeform / Dynamic Roads)</option>
                        <option value="center_spine">Center Spine</option>
                        <option value="center_cross">Center Cross (Vertical & Horizontal)</option>
                        <option value="grid">Grid Tracks (Every 5 tiles)</option>
                        <option value="perimeter">Perimeter Loop</option>
                        <option value="custom">Use Painted Roads (Custom)</option>
                    </select>
                </div>

                <!-- Simulated Annealing Parameters -->
                <div id="annealing-params" style="display: none; flex-direction: column; gap: 4px; width: 100%;">
                    <label for="annealing-iter" style="font-size: 0.8rem; color: var(--text-muted);">Search Iterations</label>
                    <input type="number" id="annealing-iter" value="1500" min="100" max="10000" step="100" required>
                </div>

                <div class="inputs" style="flex-direction: column; align-items: flex-start; gap: 4px; width: 100%;">
                    <label for="opt-time" style="font-size: 0.8rem; color: var(--text-muted);">Optimization Time (seconds)</label>
                    <input type="number" id="opt-time" value="10" min="1" max="300" required>
                </div>

                <label class="checkbox-label" style="display: flex; align-items: center; gap: 8px; margin-top: 4px; font-size: 0.9rem; color: #cbd5e1; cursor: pointer;">
                    <input type="checkbox" id="townhall-fixed" checked style="width: auto; cursor: pointer;">
                    Root Hub Position Fixed
                </label>
                <label class="checkbox-label" id="resume-weights-container" style="display: none; align-items: center; gap: 8px; margin-top: 4px; font-size: 0.9rem; color: #cbd5e1; cursor: pointer;">
                    <input type="checkbox" id="resume-weights" style="width: auto; cursor: pointer;">
                    Warm Start AI Weights (Resume)
                </label>
                <label class="checkbox-label" id="early-stopping-container" style="display: none; align-items: center; gap: 8px; margin-top: 4px; font-size: 0.9rem; color: #cbd5e1; cursor: pointer;">
                    <input type="checkbox" id="early-stopping" checked style="width: auto; cursor: pointer;">
                    Early Stopping (On Stagnation)
                </label>
                <div class="optimize-container" style="display: flex; gap: 8px; width: 100%;">
                    <button id="btn-optimize" class="btn primary" style="flex: 2;">Optimize Layout</button>
                    <button id="btn-abort" class="btn danger" disabled style="flex: 1; background-color: var(--danger);">Abort</button>
                </div>
            </div>
            
            <div class="panel debug-panel">
                <h2>Debug Output</h2>
                <div id="solver-summary-stats" style="margin-bottom: 8px; font-size: 11px; line-height: 1.4; color: #38bdf8; font-family: sans-serif;"></div>
                <textarea id="debug-output" readonly style="width: 100%; height: 100px; font-family: monospace; font-size: 10px; background: #0f172a; color: #cbd5e1; border: 1px solid #334155; border-radius: 4px; padding: 5px;"></textarea>
            </div>

            <div class="panel root-building-panel">
                <h2>Root Hub</h2>
                <div class="inputs" style="flex-direction: column; align-items: flex-start; gap: 4px;">
                    <label for="root-select" style="font-size: 0.8rem; color: var(--text-muted);">Type</label>
                    <select id="root-select" style="width: 100%;">
                        <option value="townhall">Townhall (7×6)</option>
                        <option value="embassy">Embassy (Custom Size)</option>
                    </select>
                </div>
                <div id="embassy-size-container" style="display: none; flex-direction: column; gap: 4px; width: 100%;">
                    <label style="font-size: 0.8rem; color: var(--text-muted);">Embassy Size</label>
                    <div class="inputs">
                        <input type="number" id="embassy-w" value="4" min="1" required>
                        <span>×</span>
                        <input type="number" id="embassy-h" value="4" min="1" required>
                    </div>
                </div>
            </div>

            <div class="panel buildings-panel">
                <h2>Buildings</h2>
                <form id="add-building-form">
                    <input type="text" id="b-name" list="catalog-list" placeholder="Name" required autocomplete="off">
                    <datalist id="catalog-list"></datalist>
                    <div class="inputs">
                        <input type="number" id="b-w" placeholder="W" min="1" required>
                        <input type="number" id="b-h" placeholder="H" min="1" required>
                    </div>
                    <select id="b-road">
                        <option value="0">No Road</option>
                        <option value="1">1x1 Road</option>
                        <option value="2">2x2 Road</option>
                    </select>
                    <div class="inputs" style="margin-top:5px;">
                        <input type="number" id="b-qty" placeholder="Qty" value="1" min="1" required>
                        <button type="submit" class="btn add-btn">+ Add</button>
                    </div>
                </form>
                <ul id="buildings-list"></ul>
            </div>
        </aside>

        <main class="canvas-container">
            <div id="status-banner"></div>
            <div class="grid-wrapper">
                <!-- Top-Left Corner -->
                <div></div>
                
                <!-- Top X-Labels -->
                <div id="grid-labels-top" class="grid-labels-x"></div>
                
                <!-- Top-Right Corner -->
                <div></div>
                
                <!-- Left Y-Labels -->
                <div id="grid-labels-left" class="grid-labels-y"></div>
                
                <!-- The Core Grid -->
                <div id="city-grid" class="grid"></div>
                
                <!-- Right Y-Labels -->
                <div id="grid-labels-right" class="grid-labels-y"></div>
                
                <!-- Bottom-Left Corner -->
                <div></div>
                
                <!-- Bottom X-Labels -->
                <div id="grid-labels-bottom" class="grid-labels-x"></div>
                
                <!-- Bottom-Right Corner -->
                <div></div>
            </div>
            
            <!-- Unplaced Buildings Dock -->
            <div id="unplaced-dock" class="unplaced-dock-panel">
                <h3>Unplaced Buildings Dock</h3>
                <div id="unplaced-dock-items" class="dock-items-container"></div>
            </div>
        </main>
    </div>
    
    <div id="tooltip" style="position: absolute; display: none; background: rgba(0,0,0,0.8); color: white; padding: 5px 10px; border-radius: 4px; pointer-events: none; z-index: 1000; font-size: 0.9rem; white-space: nowrap;"></div>

    <script src="static/app.js?v=1.0.5"></script>
</body>
</html>
